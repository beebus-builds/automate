<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{SEO_DESC}}">
  <meta property="og:title" content="{{SEO_TITLE}}">
  <meta property="og:description" content="{{SEO_DESC}}">
  <meta property="og:image" content="{{SEO_IMAGE}}">
  <meta name="theme-color" content="{{PRIMARY_COLOR}}">
  {{GA_SCRIPT}}
  {{CUSTOM_HEAD}}
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="layout-wide">

  <header class="navbar" id="navbar">
    <div class="navbar__inner container">
      <a href="#home" class="navbar__logo">
        <span class="navbar__icon">{{INITIALS}}</span>
        <span class="navbar__text">{{SITE_TITLE}}</span>
      </a>
      <nav class="navbar__nav" id="navbarNav">
        <ul class="navbar__list">
          {{NAV_HTML}}
        </ul>
      </nav>
      <button class="navbar__hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    {{SECTIONS_HTML}}
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <span class="footer__icon">{{INITIALS}}</span>
        <div>
          <span class="footer__name">{{SITE_TITLE}}</span>
          <p class="footer__copy">&copy; {{YEAR}} All rights reserved.</p>
        </div>
      </div>
      <div class="footer__social">
        {{SOCIAL_HTML}}
      </div>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <div class="toast" id="toast"></div>
  <script src="js/script.js"></script>
</body>
</html>
