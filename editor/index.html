<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="editor">
    <header class="editor__header">
      <h1>Portfolio Builder</h1>
      <p>Fill in your details and generate your website</p>
    </header>

    <div class="editor__body">
      <form id="editorForm" class="editor__form">
        <div class="panel">
          <h2 class="panel__title">Theme</h2>
          <div class="form-row">
            <div class="form-group">
              <label>Primary Color</label>
              <input type="color" id="colorPrimary" value="#4f46e5">
            </div>
            <div class="form-group">
              <label>Accent Color</label>
              <input type="color" id="colorAccent" value="#059669">
            </div>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel__title">General</h2>
          <div class="form-group">
            <label>Site Title</label>
            <input type="text" id="siteTitle" value="Teacher Portfolio">
          </div>
          <div class="form-group">
            <label>Hero Title</label>
            <input type="text" id="heroTitle" value="Empowering Every Learner">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Highlighted Word</label>
              <input type="text" id="heroHighlight" value="Every Learner">
            </div>
            <div class="form-group">
              <label>Hero Tagline</label>
              <input type="text" id="heroTagline" value="Welcome to My Teaching Portfolio">
            </div>
          </div>
          <div class="form-group">
            <label>Hero Description</label>
            <textarea id="heroDesc" rows="3">Passionate educator dedicated to creating engaging, inclusive, and impactful learning experiences that inspire students to reach their full potential.</textarea>
          </div>
          <div class="form-group">
            <label>Avatar Initials</label>
            <input type="text" id="avatarInitials" value="TP" maxlength="2">
          </div>
        </div>

        <div class="panel">
          <h2 class="panel__title">About</h2>
          <div class="form-group">
            <label>Bio Lead</label>
            <input type="text" id="aboutLead" value="Hello! I'm a dedicated educator with over [X] years of experience shaping young minds and fostering a love for learning.">
          </div>
          <div class="form-group">
            <label>Bio Paragraph 1</label>
            <textarea id="aboutP1" rows="3">My teaching journey has taken me through [subject/grade levels], where I've developed innovative approaches to engage students and make complex concepts accessible and enjoyable.</textarea>
          </div>
          <div class="form-group">
            <label>Bio Paragraph 2</label>
            <textarea id="aboutP2" rows="3">I believe that every student has unique strengths and potential. My mission is to create a supportive and stimulating environment where students can grow both academically and personally.</textarea>
          </div>
          <h3 class="panel__subtitle">Stats</h3>
          <div id="statsContainer">
            <div class="stat-row" data-index="0">
              <input type="number" placeholder="Number" class="stat-num" value="10" min="0">
              <input type="text" placeholder="Suffix (e.g. +, years)" class="stat-suffix" value="+">
              <input type="text" placeholder="Label" class="stat-label" value="Years Experience">
              <button type="button" class="btn-remove-stat">&times;</button>
            </div>
            <div class="stat-row" data-index="1">
              <input type="number" placeholder="Number" class="stat-num" value="500">
              <input type="text" placeholder="Suffix" class="stat-suffix" value="+">
              <input type="text" placeholder="Label" class="stat-label" value="Students Mentored">
              <button type="button" class="btn-remove-stat">&times;</button>
            </div>
            <div class="stat-row" data-index="2">
              <input type="number" placeholder="Number" class="stat-num" value="3">
              <input type="text" placeholder="Suffix" class="stat-suffix" value="">
              <input type="text" placeholder="Label" class="stat-label" value="Subject Specializations">
              <button type="button" class="btn-remove-stat">&times;</button>
            </div>
          </div>
          <button type="button" id="addStat" class="btn btn-sm">+ Add Stat</button>
        </div>

        <div class="panel">
          <h2 class="panel__title">Courses</h2>
          <div id="coursesContainer"></div>
          <button type="button" id="addCourse" class="btn btn-sm">+ Add Course</button>
        </div>

        <div class="panel">
          <h2 class="panel__title">Philosophy</h2>
          <div class="form-group">
            <label>Quote</label>
            <textarea id="philQuote" rows="2">"Education is not the filling of a pail, but the lighting of a fire."</textarea>
          </div>
          <div class="form-group">
            <label>Quote Attribution</label>
            <input type="text" id="philCite" value="— William Butler Yeats">
          </div>
          <h3 class="panel__subtitle">Philosophy Points</h3>
          <div id="philPointsContainer"></div>
          <button type="button" id="addPhilPoint" class="btn btn-sm">+ Add Point</button>
        </div>

        <div class="panel">
          <h2 class="panel__title">Achievements</h2>
          <div id="achievementsContainer"></div>
          <button type="button" id="addAchievement" class="btn btn-sm">+ Add Achievement</button>
        </div>

        <div class="panel">
          <h2 class="panel__title">Contact</h2>
          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input type="text" id="contactEmail" value="teacher@example.com">
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="text" id="contactPhone" value="+1 (555) 123-4567">
            </div>
          </div>
          <div class="form-group">
            <label>Location</label>
            <input type="text" id="contactLocation" value="City, State / Country">
          </div>
        </div>
      </form>

      <aside class="editor__preview">
        <h2>Preview</h2>
        <div class="preview-frame" id="previewFrame">
          <div class="preview-content" id="previewContent"></div>
        </div>
        <div class="preview-actions">
          <button type="button" id="btnGenerate" class="btn btn--primary btn--lg">Generate Website</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
