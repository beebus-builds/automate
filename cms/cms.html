<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS - Teacher Portfolio Builder</title>
  <link rel="stylesheet" href="cms.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cms">
    <aside class="cms__sidebar">
      <div class="cms__sidebar-brand">
        <h1>Portfolio CMS</h1>
        <p>Teacher Content Editor</p>
      </div>
      <nav class="cms__sidebar-nav" id="sidebarNav"></nav>
      <div class="cms__sidebar-footer">
        <a href="../index.html" style="color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 6px;">
          <span>&larr; Exit to Homepage</span>
        </a>
      </div>
    </aside>

    <div class="cms__main">
      <div class="cms__topbar">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="cms__topbar-title" id="topbarTitle">General</span>
          <span class="cms-status cms-status--saved" id="saveStatus">Saved</span>
        </div>
        <div class="cms__topbar-actions">
          <button class="btn btn--outline btn--sm" id="btnLoad" title="Upload an existing data.json">Load JSON</button>
          <button class="btn btn--outline btn--sm" id="btnDownload" title="Download your data file">Download JSON</button>
          <button class="btn btn--primary btn--sm" id="btnBuild" title="Export and prepare website">Build Site</button>
        </div>
      </div>

      <div class="cms__content" id="cmsContent">
      </div>

      <aside class="cms-preview" id="cmsPreview">
        <div class="cms-preview__header">
          <span style="display: flex; align-items: center; gap: 8px;">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block;"></span>
            <strong>Real-Time Live Preview</strong>
          </span>
          <button class="btn btn--sm btn--outline" id="btnTogglePreview">Close</button>
        </div>
        <div class="cms-preview__body">
          <iframe id="previewFrame" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
      </aside>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".json" style="display:none">

  <script src="cms.js"></script>
</body>
</html>
