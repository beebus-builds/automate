<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Teacher Portfolio CMS</title>
  <link rel="stylesheet" href="cms.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cms">
    <aside class="cms__sidebar">
      <div class="cms__sidebar-brand">
        <h1>Portfolio CMS</h1>
        <p>Professional Edition</p>
      </div>
      <nav class="cms__sidebar-nav" id="sidebarNav"></nav>
      <div class="cms__sidebar-footer">
        <a href="../index.html" class="cms__back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to Homepage
        </a>
      </div>
    </aside>

    <div class="cms__main">
      <div class="cms__topbar">
        <div class="cms__topbar-left">
          <span class="cms__topbar-title" id="topbarTitle">Dashboard</span>
          <span class="cms-status" id="saveStatus">Saved</span>
        </div>
        <div class="cms__topbar-actions">
          <div class="preview-devices" id="previewDevices">
            <button class="device-btn active" data-device="desktop" title="Desktop">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </button>
            <button class="device-btn" data-device="tablet" title="Tablet">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            </button>
            <button class="device-btn" data-device="mobile" title="Mobile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            </button>
          </div>
          <button class="btn btn--outline btn--sm" id="btnUndo" title="Undo last change">Undo</button>
          <button class="btn btn--outline btn--sm" id="btnLoad">Load JSON</button>
          <button class="btn btn--outline btn--sm" id="btnDownload">Download JSON</button>
          <button class="btn btn--primary btn--sm" id="btnBuild">Build Site</button>
        </div>
      </div>

      <div class="cms__body">
        <div class="cms__content" id="cmsContent"></div>

        <aside class="cms-preview" id="cmsPreview">
          <div class="cms-preview__header">
            <span class="cms-preview__title">
              <span class="preview-dot"></span>
              Live Preview
            </span>
            <button class="btn btn--sm btn--outline" id="btnTogglePreview">Close</button>
          </div>
          <div class="cms-preview__body" id="previewBody">
            <iframe id="previewFrame" class="preview-desktop"></iframe>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- Media Modal -->
  <div class="modal-overlay" id="mediaModal">
    <div class="modal">
      <div class="modal__header">
        <h2>Media Library</h2>
        <button class="modal__close" id="closeMedia">&times;</button>
      </div>
      <div class="modal__body">
        <div class="media-upload">
          <label class="media-upload__btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload Image
            <input type="file" accept="image/*" id="mediaUpload" hidden>
          </label>
          <p class="media-upload__hint">PNG, JPG, GIF up to 5MB</p>
        </div>
        <div class="media-grid" id="mediaGrid">
          <div class="media-empty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <p>No images yet. Upload your first image above.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <input type="file" id="fileInput" accept=".json" style="display:none">
  <script src="cms.js"></script>
</body>
</html>
